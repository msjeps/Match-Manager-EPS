plugins {
    id 'com.android.application'
}

def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) { keystoreFile.withInputStream { keystoreProps.load(it) } }

android {
    namespace 'com.teneps.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.teneps.app"
        minSdk 24
        targetSdk 34
        versionCode 12
        versionName "2.0"
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Source unique : index.html à la racine du dépôt, recopié dans les assets à chaque build
// (android/app/src/main/assets/index.html est généré, non versionné).
tasks.register('syncWebApp', Copy) {
    from "${rootDir}/../index.html"
    into "${projectDir}/src/main/assets"
}
preBuild.dependsOn 'syncWebApp'

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
}
